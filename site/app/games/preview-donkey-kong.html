<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donkey Kong preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b1016;
        color: #e8edf5;
        font-family: Outfit, system-ui, sans-serif;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 1.25rem;
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.35rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1rem;
        color: rgba(232, 237, 245, 0.72);
      }
      #stage {
        height: min(72vh, 720px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        overflow: hidden;
        background: #05080c;
      }
      #stage .games-hud {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 0.55rem 0.85rem;
        font-size: 0.85rem;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.72));
        pointer-events: none;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .cover {
        margin-top: 1rem;
        max-width: 320px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Donkey Kong — preview</h1>
      <p>Left/Right move · Up/Down ladders · Space jump</p>
      <div id="stage"></div>
      <img class="cover" src="/app/games/covers/donkey-kong.jpg" alt="Donkey Kong cover" width="320" height="240" />
    </div>
    <script type="module">
      import { mountDonkeyKong } from "./donkey-kong.js";
      const root = document.getElementById("stage");
      root.style.position = "relative";
      mountDonkeyKong(root);
    </script>
  </body>
</html>
